<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Online appointment scheduling suite architecture</title>
  <desc id="diagram-desc">A horizontal patient journey of seven independent micro frontends. Each shares state with a central orchestrator and makes context-specific calls to Spring Boot REST APIs.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .eyebrow { fill: #64748b; font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.4px; }
      .heading { fill: #0f172a; font: 650 27px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -.45px; }
      .label { fill: #0f172a; font: 650 14px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #64748b; font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .tiny { fill: #64748b; font: 600 10px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .8px; }
      .mfe { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
      .mfe-accent { fill: #e0f2fe; }
      .state-rail { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.25; }
      .orchestrator { fill: #0f3f6b; }
      .api-layer { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.25; }
      .endpoint { fill: #ffffff; stroke: #bbf7d0; stroke-width: 1; }
      .state-line { fill: none; stroke: #2563eb; stroke-width: 1.6; }
      .api-line { fill: none; stroke: #16a34a; stroke-width: 1.25; stroke-dasharray: 4 4; opacity: .85; }
      .journey-line { fill: none; stroke: #94a3b8; stroke-width: 1.2; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="820" rx="20"/>
  <text class="eyebrow" x="64" y="63">ONLINE APPOINTMENT SCHEDULING SUITE</text>
  <text class="heading" x="64" y="101">Independent steps, one cohesive patient journey</text>

  <!-- Patient journey -->
  <text class="tiny" x="64" y="143">PATIENT JOURNEY · INDEPENDENT MICRO FRONTENDS</text>
  <path class="journey-line" d="M 85 184 H 1355" marker-end="url(#arrow-slate)"/>

  <!-- Micro frontends -->
  <g aria-label="Specialty Selection micro frontend">
    <rect class="mfe" x="65" y="205" width="170" height="86" rx="10"/>
    <rect class="mfe-accent" x="65" y="205" width="5" height="86" rx="2.5"/>
    <text class="tiny" x="85" y="230">01</text><text class="label" x="85" y="258">Specialty</text><text class="label" x="85" y="276">Selection</text>
  </g>
  <g aria-label="Time provider location micro frontend">
    <rect class="mfe" x="255" y="205" width="170" height="86" rx="10"/>
    <rect class="mfe-accent" x="255" y="205" width="5" height="86" rx="2.5"/>
    <text class="tiny" x="275" y="230">02</text><text class="label" x="275" y="258">Time / Provider /</text><text class="label" x="275" y="276">Location</text>
  </g>
  <g aria-label="Time Slot Selection micro frontend">
    <rect class="mfe" x="445" y="205" width="170" height="86" rx="10"/>
    <rect class="mfe-accent" x="445" y="205" width="5" height="86" rx="2.5"/>
    <text class="tiny" x="465" y="230">03</text><text class="label" x="465" y="258">Time Slot</text><text class="label" x="465" y="276">Selection</text>
  </g>
  <g aria-label="Patient Demographics micro frontend">
    <rect class="mfe" x="635" y="205" width="170" height="86" rx="10"/>
    <rect class="mfe-accent" x="635" y="205" width="5" height="86" rx="2.5"/>
    <text class="tiny" x="655" y="230">04</text><text class="label" x="655" y="258">Patient</text><text class="label" x="655" y="276">Demographics</text>
  </g>
  <g aria-label="Insurance Info micro frontend">
    <rect class="mfe" x="825" y="205" width="170" height="86" rx="10"/>
    <rect class="mfe-accent" x="825" y="205" width="5" height="86" rx="2.5"/>
    <text class="tiny" x="845" y="230">05</text><text class="label" x="845" y="267">Insurance Info</text>
  </g>
  <g aria-label="Review micro frontend">
    <rect class="mfe" x="1015" y="205" width="170" height="86" rx="10"/>
    <rect class="mfe-accent" x="1015" y="205" width="5" height="86" rx="2.5"/>
    <text class="tiny" x="1035" y="230">06</text><text class="label" x="1035" y="267">Review</text>
  </g>
  <g aria-label="Confirmation micro frontend">
    <rect class="mfe" x="1205" y="205" width="170" height="86" rx="10"/>
    <rect class="mfe-accent" x="1205" y="205" width="5" height="86" rx="2.5"/>
    <text class="tiny" x="1225" y="230">07</text><text class="label" x="1225" y="267">Confirmation</text>
  </g>

  <!-- API requests: deliberately light so shared-state reads first -->
  <g aria-label="Context-specific API calls">
    <path class="api-line" d="M150 291 V614" marker-end="url(#arrow-green)"/>
    <path class="api-line" d="M340 291 V614" marker-end="url(#arrow-green)"/>
    <path class="api-line" d="M530 291 V614" marker-end="url(#arrow-green)"/>
    <path class="api-line" d="M720 291 V614" marker-end="url(#arrow-green)"/>
    <path class="api-line" d="M910 291 V614" marker-end="url(#arrow-green)"/>
    <path class="api-line" d="M1100 291 V614" marker-end="url(#arrow-green)"/>
    <path class="api-line" d="M1290 291 V614" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Shared state rail -->
  <text class="tiny" x="64" y="347">SHARED STATE ON EVERY FORWARD / BACK NAVIGATION</text>
  <rect class="state-rail" x="65" y="365" width="1310" height="54" rx="10"/>
  <text class="small" x="93" y="398">Journey state</text>
  <text class="small" x="1276" y="398" text-anchor="end">current data + navigation intent</text>
  <g aria-label="Bidirectional state synchronization">
    <path class="state-line" d="M150 291 V365" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <path class="state-line" d="M340 291 V365" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <path class="state-line" d="M530 291 V365" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <path class="state-line" d="M720 291 V365" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <path class="state-line" d="M910 291 V365" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <path class="state-line" d="M1100 291 V365" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <path class="state-line" d="M1290 291 V365" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  </g>
  <path class="state-line" d="M720 419 V461" marker-end="url(#arrow-blue)"/>

  <!-- Orchestrator -->
  <g aria-label="Central journey orchestrator">
    <rect class="orchestrator" x="494" y="461" width="452" height="96" rx="12"/>
    <text x="720" y="497" text-anchor="middle" style="fill:#bfdbfe;font:600 11px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.2px">CENTRAL ORCHESTRATOR</text>
    <text x="720" y="526" text-anchor="middle" style="fill:#fff;font:650 18px Inter,ui-sans-serif,system-ui,sans-serif">Coordinates the appointment journey</text>
    <text x="720" y="547" text-anchor="middle" style="fill:#dbeafe;font:500 12px Inter,ui-sans-serif,system-ui,sans-serif">persists shared state · resolves next / previous step</text>
  </g>

  <!-- REST API layer -->
  <text class="tiny" x="64" y="594" fill="#15803d">CONTEXT-SPECIFIC DATA REQUESTS</text>
  <rect class="api-layer" x="65" y="614" width="1310" height="139" rx="12"/>
  <text x="94" y="651" style="fill:#166534;font:650 15px Inter,ui-sans-serif,system-ui,sans-serif">Spring Boot REST APIs</text>
  <text x="94" y="674" style="fill:#4b7a59;font:500 12px Inter,ui-sans-serif,system-ui,sans-serif">Each frontend retrieves only the data its current step needs.</text>
  <g aria-label="REST API endpoint domains">
    <rect class="endpoint" x="94" y="698" width="142" height="30" rx="6"/><text class="small" x="165" y="718" text-anchor="middle">specialties</text>
    <rect class="endpoint" x="250" y="698" width="142" height="30" rx="6"/><text class="small" x="321" y="718" text-anchor="middle">providers + locations</text>
    <rect class="endpoint" x="406" y="698" width="142" height="30" rx="6"/><text class="small" x="477" y="718" text-anchor="middle">availability</text>
    <rect class="endpoint" x="562" y="698" width="142" height="30" rx="6"/><text class="small" x="633" y="718" text-anchor="middle">patient profile</text>
    <rect class="endpoint" x="718" y="698" width="142" height="30" rx="6"/><text class="small" x="789" y="718" text-anchor="middle">insurance</text>
    <rect class="endpoint" x="874" y="698" width="142" height="30" rx="6"/><text class="small" x="945" y="718" text-anchor="middle">appointment review</text>
    <rect class="endpoint" x="1030" y="698" width="142" height="30" rx="6"/><text class="small" x="1101" y="718" text-anchor="middle">booking</text>
  </g>
  <text class="small" x="1375" y="794" text-anchor="end">Blue: shared state synchronization  ·  Green: REST API requests</text>
</svg>
